<!DOCTYPE html>
<html lang="es">

<head>
    
    <meta charset="UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Nombro mi pagina web -->

    <title>Sistema de Calificaciones</title>

    <!-- Aquí conecto mi archivo de diseño CSS -->
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <!--  Agrupo y centro todo en la pantalla -->
    <div class="contenedor">

        <h1>Sistema de Calificaciones</h1>

        <p>Captura los datos y calificaciones del alumno</p>

        <!-- Agrupo todos los campos que el usuario va a llenar -->
        <div class="formulario">

            <!-- Caja de texto  -->
            <label for="nombre">Nombre del alumno:</label>
            <input type="text" id="nombre" placeholder="Escribe el nombre">

            <!-- Caja de números  -->
            <label for="edad">Edad:</label>
            <input type="number" id="edad" min="0" placeholder="Escribe la edad">

            <!-- Cajitas para las calificaciones-->
            <label for="calificacion1">Calificación 1:</label>
            <input type="number" id="calificacion1" min="0" max="10">

            <label for="calificacion2">Calificación 2:</label>
            <input type="number" id="calificacion2" min="0" max="10">

            <label for="calificacion3">Calificación 3:</label>
            <input type="number" id="calificacion3" min="0" max="10">

            <!-- Calificación que agregue -->
            <label for="calificacion4">Calificación 4:</label>
            <input type="number" id="calificacion4" min="0" max="10">

            <!-- Mi botón que activa la función de JavaScript al darle clic -->
            <button onclick="calcularPromedio()">
                Calcular promedio
            </button>

        </div>

        <!-- En este espacio vacío es donde JavaScript va a inyectar mi resultado final -->
        <div id="resultado" class="resultado"></div>

    </div>

    <!-- Conexión con el  archivo de JavaScript  -->
    <script src="script.js"></script>

</body>

</html>
